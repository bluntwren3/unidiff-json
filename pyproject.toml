[project]
name = "unidiff-json"
version = "0.1.0"
description = "Convert between unified diff text and a structured JSON representation"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
unidiff-json = "unidiff_json.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
